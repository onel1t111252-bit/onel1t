 en:{html:'en',title:'ONEL1T AEGIS | Case Study',desc:'Case study for ONEL1T AEGIS, a local-first defensive security operations simulation connecting incidents, assets, risk, response playbooks and reporting.',portfolio:'ONEL1T PORTFOLIO ↗',kicker:'CASE STUDY / DEFENSIVE SECURITY PRODUCT',hero:'A local-first security operations simulation designed to connect incident triage, asset context, risk decisions, response playbooks and analyst reporting without touching live systems or external targets.',open:'OPEN PLATFORM ↗',source:'SOURCE ↗',footer:'ONEL1T AEGIS · SYNTHETIC DATA · DEFENSIVE TRAINING · LOCAL-FIRST',cards:[['01 / PROBLEM','Security learning is often fragmented.','Logs, assets, risks, response steps and reports are commonly studied as separate topics. The project goal was to turn those concepts into one coherent defensive workflow.'],['02 / SOLUTION','One connected analyst workspace.','AEGIS presents synthetic incidents alongside the affected asset, risk context, response steps and reporting state so that each analyst action has visible context.'],['03 / WORKFLOW','Observe → Context → Decide → Record',[['01','Observe','Synthetic alerts enter the local queue.'],['02','Context','Review asset ownership, controls and criticality.'],['03','Decide','Prioritize, triage and select a safe response path.'],['04','Record','Track status, response progress and analyst summary.']]],['04 / MODULES','What is included',['Operations overview and security-posture metrics','Synthetic incident queue and triage state','Asset inventory and defensive controls','Risk register and treatment decisions','Interactive response playbooks','Training scenarios and text-report export','EN / UA / CZ interface']],['05 / SAFETY','Designed as a safe lab.','AEGIS does not scan networks, exploit systems, collect credentials or interact with external targets. The data is synthetic and the project runs locally in the browser.'],['06 / TECH','Implementation',{tags:['HTML','CSS','VANILLA JS','LOCALST  cs:{html:'cs',title:'ONEL1T AEGIS | Případová studie',desc:'Případová studie ONEL1T AEGIS — lokální výukové platformy kybernetické bezpečnosti propojující incidenty, aktiva, rizika, postupy reakce a reporting.',portfolio:'PORTFOLIO ONEL1T ↗',kicker:'PŘÍPADOVÁ STUDIE / PLATFORMA KYBERNETICKÉ BEZPEČNOSTI',hero:'Lokální výuková platforma bezpečnostních operací navržená tak, aby propojila zpracování incidentů, kontext aktiv, hodnocení rizik, postupy reakce a reporting analytika bez kontaktu s reálnými systémy nebo externími cíli.',open:'OTEVŘÍT PLATFORMU ↗',source:'ZDROJOVÝ KÓD ↗',footer:'ONEL1T AEGIS · SYNTETICKÁ DATA · VÝUKA KYBERNETICKÉ BEZPEČNOSTI · LOKÁLNÍ PROVOZ',cards:[['01 / PROBLÉM','Výuka kybernetické bezpečnosti bývá často roztříštěná.','Logy, aktiva, rizika, kroky reakce a reporting se často studují odděleně. Cílem projektu bylo propojit tyto oblasti do jednoho souvislého bezpečnostního procesu.'],['02 / ŘEŠENÍ','Jedno propojené pracovní prostředí analytika.','AEGIS zobrazuje syntetické incidenty společně s dotčenými aktivy, kontextem rizik, kroky reakce a stavem reportingu, takže každá činnost analytika má jasný kontext.'],['03 / POSTUP','Sledování → Kontext → Rozhodnutí → Záznam',[['01','Sledování','Syntetické signály vstupují do lokální fronty.'],['02','Kontext','Kontroluje se odpovědný tým, bezpečnostní opatření a kritičnost aktiva.'],['03','Rozhodnutí','Určí se priorita a bezpečný způsob reakce.'],['04','Záznam','Uloží se stav, provedené kroky a souhrn analytika.']]],['04 / MODULY','Co platforma obsahuje',['Přehled operací a metriky stavu zabezpečení','Frontu syntetických incidentů a stav jejich zpracování','Inventář aktiv a bezpečnostní opatření','Registr rizik a rozhodnutí o jejich ošetření','Interaktivní postupy reakce','Výukové scénáře a export textového reportu','Rozhraní EN / UA / CZ']],['05 / BEZPEČNOST','Navrženo jako bezpečná výuková laboratoř.','AEGIS neskenuje reálné sítě, nezneužívá zranitelnosti, neshromažďuje přihlašovací údaje ani nekomu
