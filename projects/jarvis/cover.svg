<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">ONEL1T JARVIS 3.0 futuristic interface preview</title>
<desc id="desc">Dark cinematic Ukrainian desktop assistant dashboard with a cyan circular reactor, truthful status panels, voice volume slider, command queue and a visible confirmation control. Concept graphic, not a live Windows screenshot.</desc>
<defs>
  <radialGradient id="space" cx="44%" cy="47%" r="85%">
    <stop offset="0" stop-color="#133a52"/>
    <stop offset=".58" stop-color="#061728"/>
    <stop offset="1" stop-color="#030812"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#3ff2ff"/><stop offset="1" stop-color="#3b79ed"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#112c43"/><stop offset="1" stop-color="#071624"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#1b465b" stroke-width=".75" opacity=".36"/>
  </pattern>
</defs>
