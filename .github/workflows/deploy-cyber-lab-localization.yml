name: Deploy complete Cyber Lab localization

on:
  push:
    paths:
      - '.github/workflows/deploy-cyber-lab-localization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify localization JavaScript
        run: node --check projects/cyber-lab/localization-complete.js
      - name: Load complete localization layer
        shell: python
        run: |
          from pathlib import Path
          p=Path('projects/cyber-lab/index.html')
          s=p.read_text(encoding='utf-8')
          old_tags=[
              '<script src="localization-complete.js?v=20261029-1"></script>',
              '<script src="localization-complete.js"></script>'
          ]
          for tag in old_tags:
              s=s.replace(tag,'')
          tag='<script src="localization-complete.js?v=20261029-1"></script>'
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify integration
        shell: python
        run: |
          from pathlib import Path
          s=Path('projects/cyber-lab/index.html').read_text(encoding='utf-8')
          js=Path('projects/cyber-lab/localization-complete.js').read_text(encoding='utf-8')
          assert s.count('localization-complete.js?v=20261029-1') == 1
          assert "'Multiple failed login attempts'" in js
          assert "'Networking basics'" in js
          assert "'Weak characteristics'" in js
          assert "'URL does not use HTTPS'" in js
          assert "exportLocalizedReport" in js
          print('Cyber Lab complete localization linked and verified')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/cyber-lab/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load complete Cyber Lab localization layer"
          git push
