name: CV AEGIS artwork
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply AEGIS artwork styling
        shell: python
        run: |
          from pathlib import Path
          p=Path('cv-13.css')
          s=p.read_text(encoding='utf-8')
          marker='/* AEGIS flagship artwork */'
          if marker not in s:
              s += '''\n\n/* AEGIS flagship artwork */\n.cv-aegis-media{background:url('assets/optimized/aegis-cover.webp?v=magenta-20261031-1') center center/cover no-repeat!important;}\n.cv-aegis-media>span,.cv-aegis-media>small{display:none!important;}\n.cv-aegis-media:before{content:none!important;}\n@media(max-width:520px){.cv-aegis-media{background-position:center 48%!important;}}\n'''
              p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q "aegis-cover.webp?v=magenta-20261031-1" cv-13.css
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv-13.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show AEGIS artwork in CV flagship card'
          git push origin HEAD:main
