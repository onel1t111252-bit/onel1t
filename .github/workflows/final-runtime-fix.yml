name: Final runtime fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-runtime-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix browser-detected runtime errors
        shell: python
        run: |
          from pathlib import Path

          nexus=Path('projects/nexus/index.html')
          s=nexus.read_text(encoding='utf-8')
          bad="$('[data-region]').forEach("
          good="$$('[data-region]').forEach("
          assert bad in s, 'NEXUS target bug not found'
          s=s.replace(bad,good,1)
          nexus.write_text(s,encoding='utf-8')

          cyber=Path('projects/cyber-lab/index.html')
          s=cyber.read_text(encoding='utf-8')
          bad='translations[k][langs[current]]'
          good='translations[k][langIndex(current)]'
          assert bad in s, 'Cyber Lab target bug not found'
          s=s.replace(bad,good,1)
          cyber.write_text(s,encoding='utf-8')

      - name: Verify targeted fixes
        shell: python
        run: |
          from pathlib import Path
          n=Path('projects/nexus/index.html').read_text(encoding='utf-8')
          c=Path('projects/cyber-lab/index.html').read_text(encoding='utf-8')
          assert "$('[data-region]').forEach(" not in n
          assert "$$('[data-region]').forEach(" in n
          assert 'translations[k][langs[current]]' not in c
          assert 'translations[k][langIndex(current)]' in c
          print('runtime fixes verified')

      - name: Commit fixes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-runtime-fix.yml
          git add projects/nexus/index.html projects/cyber-lab/index.html
          git commit -m "Fix browser-detected NEXUS and Cyber Lab runtime errors"
          git push
