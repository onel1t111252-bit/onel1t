name: Apply Cyber Lab matrix identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cyber-theme-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Attach Cyber Lab identity safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('projects/cyber-lab/index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="cyber-identity.css?v=20261031-1">'
          if marker not in text:
              if '</head>' not in text:
                  raise SystemExit('Cyber Lab index has no </head> marker')
              text = text.replace('</head>', marker + '\n</head>', 1)
          text = text.replace('meta name="theme-color" content="#090a0d"', 'meta name="theme-color" content="#040705"', 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit Cyber Lab identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/cyber-lab/index.html
          if git diff --cached --quiet; then
            echo 'No Cyber Lab patch needed.'
          else
            git commit -m 'Apply matrix identity to Cyber Lab'
            git push origin HEAD:main
          fi
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -f .github/workflows/cyber-theme-once.yml
          git add .github/workflows/cyber-theme-once.yml
          git commit -m 'Remove one-time Cyber Lab theme workflow'
          git push origin HEAD:main
