name: AEGIS UI fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aegis-ui-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix AEGIS navigation and middle image
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          # Correct middle Quick Access artwork.
          data = ''''''
          Path('projects/aegis/aegis-quick-security-core.webp').write_bytes(base64.b64decode(data))

          # Interaction fix: only active view is visible and decorative layers never intercept taps.
          p=Path('projects/aegis/aegis-ai-core.css')
          s=p.read_text()
          marker='/* AEGIS interaction hotfix 20261031 */'
          if marker not in s:
              s += '''\n\n/* AEGIS interaction hotfix 20261031 */\nbody.ai-core-theme .view{display:none!important}\nbody.ai-core-theme .view.active{display:block!important}\nbody.ai-core-theme .aegis-ai-visual,\nbody.ai-core-theme .aegis-ai-visual *,\nbody.ai-core-theme .aegis-quick-image{pointer-events:none!important}\nbody.ai-core-theme .sidebar,\nbody.ai-core-theme .side-nav,\nbody.ai-core-theme .side-nav button,\nbody.ai-core-theme .topbar,\nbody.ai-core-theme .top-actions,\nbody.ai-core-theme .top-actions button,\nbody.ai-core-theme .top-actions a,\nbody.ai-core-theme .hero-copy,\nbody.ai-core-theme .hero-actions,\nbody.ai-core-theme .hero-actions button,\nbody.ai-core-theme .aegis-quick-card{pointer-events:auto!important}\nbody.ai-core-theme .sidebar{z-index:100!important}\nbody.ai-core-theme .topbar{z-index:90!important}\n'''
              p.write_text(s)

          # Bust CSS/JS/image caches.
          p=Path('projects/aegis/index.html')
          s=p.read_text()
          s=s.replace('aegis-ai-core.css?v=20261031-1','aegis-ai-core.css?v=20261031-interaction2')
          s=s.replace('aegis-ai-core.js?v=20261031-quickimages1','aegis-ai-core.js?v=20261031-interaction2')
          p.write_text(s)

          p=Path('projects/aegis/aegis-ai-core.js')
          s=p.read_text().replace('aegis-quick-security-core.webp?v=20261031-quick1','aegis-quick-security-core.webp?v=20261031-fixed2')
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/aegis-ui-fix.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/aegis .github/workflows/aegis-ui-fix.yml
          git commit -m 'Fix AEGIS navigation and Security Core artwork'
          git push
