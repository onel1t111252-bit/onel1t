name: Apply NEXUS violet identity
on:
  push:
    paths:
      - '.github/workflows/apply-nexus-identity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Attach NEXUS identity safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projects/nexus/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<link rel="stylesheet" href="nexus-identity.css?v=20261031-1">'
          if tag not in s:
              needle='</head>'
              assert s.count(needle)==1, f'Expected exactly one </head>, got {s.count(needle)}'
              s=s.replace(needle, tag+'\n'+needle, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/nexus/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Apply neon-violet identity to NEXUS'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -f .github/workflows/apply-nexus-identity.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-time NEXUS identity workflow'
            git pull --rebase origin main
            git push origin main
          fi
