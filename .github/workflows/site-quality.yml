name: Site quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check portfolio consistency
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import sys
          import xml.etree.ElementTree as ET

          root = Path('.').resolve()
          errors = []

          # Contact regression guard.
          text_files = []
          for pattern in ('*.html', '*.css', '*.js', '*.md', '*.txt', '*.xml'):
              text_files.extend(root.rglob(pattern))
          corpus = '\n'.join(p.read_text(encoding='utf-8', errors='ignore') for p in text_files)
          if 'maxymdymchuk@gmail.com' in corpus:
              errors.append('Old email address is still present in shipped content.')

          # Every real project directory must be directly openable and indexed.
          projects_root = root / 'projects'
          project_dirs = sorted(d for d in projects_root.iterdir() if d.is_dir())
          for project in project_dirs:
              if not (project / 'index.html').exists():
                  errors.append(f'{project.relative_to(root)}: missing index.html')

          # Sitemap URLs must resolve to repository files, and every project landing page must be listed.
          sitemap = root / 'sitemap.xml'
          if not sitemap.exists():
              errors.append('Missing sitemap.xml')
          else:
              try:
                  tree = ET.parse(sitemap)
                  ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
                  locs = [x.text.strip() for x in tree.findall('.//sm:loc', ns) if x.text and x.text.strip()]
              except Exception as exc:
                  locs = []
                  errors.append(f'sitemap.xml parse error: {exc}')
              local_paths = set()
              for loc in locs:
                  parsed = urlparse(loc)
                  path = unquote(parsed.path)
                  prefix = '/onel1t/'
                  if path == '/onel1t/':
                      local = root / 'index.html'
                      local_paths.add('index.html')
                  elif path.startswith(prefix):
                      rel = path[len(prefix):]
                      local = root / rel
                      local_paths.add(rel)
                  else:
                      continue
                  if not local.exists():
                      errors.append(f'sitemap.xml points to missing file: {loc}')
              for project in project_dirs:
                  rel = (project / 'index.html').relative_to(root).as_posix()
                  if rel not in local_paths:
                      errors.append(f'sitemap.xml missing project landing page: {rel}')

          # Flagship/current-state regression guards.
          required = {
              'home-13.js': ('ONEL1T AEGIS', 'projects/aegis/index.html'),
              'home-15.js': ('ONEL1T AEGIS', 'projects/aegis/index.html'),
              'cv-12.js': ('ONEL1T AEGIS', 'projects/aegis/index.html'),
          }
          for name, needles in required.items():
              path = root / name
              if not path.exists():
                  errors.append(f'Missing required file: {name}')
                  continue
              text = path.read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      errors.append(f'{name}: missing required flagship reference {needle!r}')

          # Privacy-mode hardening: direct access to the app-specific keys is forbidden.
          guarded_keys = {
              'home-13.js': 'onel1t-recruiter-view',
              'cv-12.js': 'onel1t-cv-ats',
          }
          for name, key in guarded_keys.items():
              text = (root / name).read_text(encoding='utf-8')
              if f"sessionStorage.setItem('{key}'" in text or f"sessionStorage.getItem('{key}'" in text:
                  errors.append(f'{name}: direct sessionStorage access for {key} found; use the safe wrapper')

          # Portfolio facts must agree with the number of project directories.
          expected = f'{len(project_dirs):02d}'
          home14 = (root / 'home-14.js').read_text(encoding='utf-8')
          if f"['{expected}','PORTFOLIO PROJECTS']" not in home14:
              errors.append(f'home-14.js: English project count is not {expected}')
          if f"['{expected}','ПРОЄКТІВ У ПОРТФОЛІО']" not in home14:
              errors.append(f'home-14.js: Ukrainian project count is not {expected}')
          if f"['{expected}','PROJEKTŮ V PORTFOLIU']" not in home14:
              errors.append(f'home-14.js: Czech project count is not {expected}')

          if errors:
              for msg in errors:
                  print(f'::error::{msg}')
              sys.exit(1)
          print(f'Portfolio consistency OK: {len(project_dirs)} project directories validated.')

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done
      - name: Check inline JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, sys, tempfile

          script_re = re.compile(r'<script\b([^>]*)>(.*?)</script\s*>', re.I | re.S)
          failures = []
          checked = 0
          for path in sorted(Path('.').rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              for idx, match in enumerate(script_re.finditer(text), 1):
                  attrs, body = match.group(1), match.group(2)
                  if re.search(r'\bsrc\s*=', attrs, re.I):
                      continue
                  type_match = re.search(r'\btype\s*=\s*["\']([^"\']+)', attrs, re.I)
                  if type_match and type_match.group(1).lower() not in ('text/javascript','application/javascript','module'):
                      continue
                  if not body.strip():
                      continue
                  checked += 1
                  suffix = '.mjs' if type_match and type_match.group(1).lower() == 'module' else '.js'
                  with tempfile.NamedTemporaryFile('w', suffix=suffix, encoding='utf-8', delete=False) as tmp:
                      tmp.write(body)
                      tmp_path = tmp.name
                  proc = subprocess.run(['node','--check',tmp_path], text=True, capture_output=True)
                  Path(tmp_path).unlink(missing_ok=True)
                  if proc.returncode:
                      failures.append(f'{path}: inline script #{idx}: {proc.stderr.strip()}')
          if failures:
              for failure in failures:
                  print(f'::error::{failure}')
              sys.exit(1)
          print(f'Checked {checked} inline JavaScript blocks.')
      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.py' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            echo "python -m py_compile $file"
            python -m py_compile "$file"
          done
      - name: Audit HTML, links, accessibility and performance
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote
          import re, sys

          root = Path('.').resolve()
          errors = []
          warnings = []

          class AuditParser(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
                  self.ids = set()
                  self.refs = []
                  self.has_lang = False
                  self.has_viewport = False
                  self.has_description = False
                  self.has_canonical = False
                  self.has_icon = False
                  self.has_title = False
                  self.in_title = False
                  self.h1_count = 0
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == 'html' and d.get('lang'):
                      self.has_lang = True
                  if tag == 'title':
                      self.in_title = True
                  if tag == 'meta' and d.get('name','').lower() == 'viewport':
                      self.has_viewport = True
                  if tag == 'meta' and d.get('name','').lower() == 'description' and d.get('content','').strip():
                      self.has_description = True
                  if tag == 'link' and d.get('rel','').lower() == 'canonical' and d.get('href'):
                      self.has_canonical = True
                  if tag == 'link' and 'icon' in d.get('rel','').lower() and d.get('href'):
                      self.has_icon = True
                  if tag == 'h1':
                      self.h1_count += 1
                  ident = d.get('id')
                  if ident:
                      if ident in self.ids:
                          errors.append(f'{self.path}: duplicate id="{ident}"')
                      self.ids.add(ident)
                  for attr in ('href','src'):
                      value = d.get(attr)
                      if value:
                          self.refs.append((tag, attr, value))
                  if tag == 'img' and 'alt' not in d:
                      errors.append(f'{self.path}: image without alt attribute: {d.get("src", "<inline>")}')
                  if tag == 'button' and 'type' not in d:
                      errors.append(f'{self.path}: button without explicit type: {d.get("id") or d.get("class") or "<button>"}')
                  if tag == 'a' and d.get('target','').lower() == '_blank':
                      rel = set(d.get('rel','').lower().split())
                      if 'noopener' not in rel:
                          errors.append(f'{self.path}: target="_blank" link missing rel="noopener"')
              def handle_endtag(self, tag):
                  if tag == 'title':
                      self.in_title = False
              def handle_data(self, data):
                  if self.in_title and data.strip():
                      self.has_title = True

          html_files = sorted(root.rglob('*.html'))
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              parser = AuditParser(path.relative_to(root))
              try:
                  parser.feed(text)
              except Exception as exc:
                  errors.append(f'{parser.path}: HTML parser error: {exc}')
                  continue
              if not parser.has_lang:
                  errors.append(f'{parser.path}: missing html[lang]')
              if not parser.has_viewport:
                  errors.append(f'{parser.path}: missing viewport meta')
              if not parser.has_description:
                  errors.append(f'{parser.path}: missing non-empty meta description')
              if not parser.has_canonical:
                  errors.append(f'{parser.path}: missing canonical link')
              if not parser.has_icon:
                  errors.append(f'{parser.path}: missing favicon link')
              if not parser.has_title:
                  errors.append(f'{parser.path}: missing non-empty title')
              if parser.h1_count == 0:
                  errors.append(f'{parser.path}: no h1 heading')
              for tag, attr, raw in parser.refs:
                  value = raw.strip()
                  if not value or value.startswith(('#','http://','https://','mailto:','tel:','data:','javascript:','//')):
                      continue
                  clean = unquote(value.split('#',1)[0].split('?',1)[0])
                  if not clean or clean.startswith('/'):
                      continue
                  target = (path.parent / clean).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError:
                      errors.append(f'{parser.path}: reference escapes repository: {raw}')
                      continue
                  if not target.exists():
                      errors.append(f'{parser.path}: missing local {attr}: {raw}')

          # Fragment navigation on localized landing pages must point to real sections.
          for name in ('index.html','index-uk.html','index-cz.html'):
              path = root / name
              text = path.read_text(encoding='utf-8')
              ids = set(re.findall(r'\bid=["\']([^"\']+)["\']', text))
              for frag in re.findall(r'href=["\']#([^"\']+)["\']', text):
                  if frag and frag not in ids:
                      errors.append(f'{name}: fragment #{frag} has no matching id')

          # Warn only about large images that are still referenced by shipped HTML/CSS/JS.
          corpus = '\n'.join(
              p.read_text(encoding='utf-8', errors='ignore')
              for pattern in ('*.html','*.css','*.js')
              for p in root.rglob(pattern)
          )
          for ext in ('*.png','*.jpg','*.jpeg','*.webp'):
              for image in root.rglob(ext):
                  size = image.stat().st_size
                  rel = image.relative_to(root).as_posix()
                  if size > 2_000_000 and (rel in corpus or image.name in corpus):
                      warnings.append(f'{rel}: referenced image is {size/1_000_000:.1f} MB')

          # Temporary repair workflows must never remain after a patch pass.
          workflows = root / '.github' / 'workflows'
          if workflows.exists():
              for wf in workflows.glob('*.yml'):
                  if wf.name != 'site-quality.yml':
                      errors.append(f'Unexpected temporary workflow remains: {wf.relative_to(root)}')

          for msg in warnings:
              print(f'::warning::{msg}')
          if errors:
              for msg in errors:
                  print(f'::error::{msg}')
              sys.exit(1)
          print(f'Audited {len(html_files)} HTML files successfully with {len(warnings)} performance warnings.')
