name: Deploy complete NEXUS localization layer

on:
  push:
    paths:
      - '.github/workflows/fix-nexus-network-matrix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load complete localization layer
        shell: python
        run: |
          from pathlib import Path
          p=Path('projects/nexus/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="localization-fix.js?v=20261029-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s=Path('projects/nexus/index.html').read_text(encoding='utf-8')
          js=Path('projects/nexus/localization-fix.js').read_text(encoding='utf-8')
          assert 'localization-fix.js?v=20261029-1' in s
          assert "'File name':['Назва файла','Název souboru']" in js
          assert "'Evidence sample':['Зразок доказів','Ukázka důkazů']" in js
          assert "'SELECTED ASSET':['ВИБРАНИЙ АКТИВ','VYBRANÝ PROSTŘEDEK']" in js
          assert "'Workspace status':['Стан робочого простору','Stav pracovního prostoru']" in js
          assert 'MutationObserver' in js
          print('complete EN/UA/CZ localization layer linked and verified')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/nexus/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load complete NEXUS localization layer"
          git push

# run: 11
