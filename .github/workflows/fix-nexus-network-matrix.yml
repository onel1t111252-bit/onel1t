name: Deploy localized NEXUS OSINT worksheet

on:
  push:
    paths:
      - '.github/workflows/fix-nexus-network-matrix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load localized OSINT worksheet
        shell: python
        run: |
          from pathlib import Path
          p=Path('projects/nexus/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="osint-fix.js?v=20261029-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s=Path('projects/nexus/index.html').read_text(encoding='utf-8')
          js=Path('projects/nexus/osint-fix.js').read_text(encoding='utf-8')
          assert 'osint-fix.js?v=20261029-1' in s
          assert "created:'Картку OSINT створено'" in js
          assert "created:'OSINT list byl vytvořen'" in js
          assert "created:'OSINT worksheet created'" in js
          assert "button.id='createOsintWorksheetBtn'" in js
          print('localized OSINT worksheet linked and verified')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/nexus/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load localized NEXUS OSINT worksheet"
          git push

