name: Load standalone NEXUS interaction fixes

on:
  push:
    paths:
      - '.github/workflows/fix-nexus-network-matrix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load independent interaction fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('projects/nexus/index.html')
          s=p.read_text(encoding='utf-8')
          matrix='<script src="matrix-fix.js?v=20261029-2"></script>'
          analyst='<script src="analyst-fix.js?v=20261029-1"></script>'
          if matrix not in s:
              s=s.replace('</body>',matrix+'\n</body>',1)
          if analyst not in s:
              s=s.replace('</body>',analyst+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s=Path('projects/nexus/index.html').read_text(encoding='utf-8')
          assert 'matrix-fix.js?v=20261029-2' in s
          assert 'analyst-fix.js?v=20261029-1' in s
          assert Path('projects/nexus/matrix-fix.js').exists()
          assert Path('projects/nexus/analyst-fix.js').exists()
          print('NEXUS interaction fixes loaded')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/nexus/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load NEXUS local analyst fix"
          git push

