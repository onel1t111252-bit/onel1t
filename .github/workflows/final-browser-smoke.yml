# rerun: 2
name: Final browser smoke

on:
  push:
    branches: [final-smoke]
    paths:
      - '.github/workflows/final-browser-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1 >/dev/null 2>&1
      - name: Browser smoke test
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const base = 'https://onel1t111252-bit.github.io/onel1t';
          const routes = [
            '/', '/index-uk.html', '/index-cz.html',
            '/cv.html', '/cv-uk.html', '/cv-cz.html',
            '/projects/nexus/index.html',
            '/projects/cyber-lab/index.html',
            '/projects/cpp-console-toolkit/index.html',
            '/projects/python-security-utilities/index.html',
            '/projects/password-strength-lab/index.html',
            '/projects/ipv4-subnet-calculator/index.html',
            '/projects/phishing-link-analyzer/index.html',
            '/projects/security-log-triage/index.html'
          ];
          const failures = [];
          function fail(msg){ failures.push(msg); console.error('FAIL:', msg); }
          function ok(msg){ console.log('OK:', msg); }

          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });

            for (const route of routes) {
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', e => pageErrors.push(String(e)));
              let response;
              try {
                response = await page.goto(base + route, { waitUntil:'domcontentloaded', timeout:30000 });
                await page.waitForTimeout(500);
                if (!response || response.status() >= 400) fail(`${route} HTTP ${response && response.status()}`);
                const title = (await page.title()).trim();
                if (!title) fail(`${route} has empty title`);
                const bodyText = (await page.locator('body').innerText()).trim();
                if (bodyText.length < 30) fail(`${route} body is unexpectedly empty`);
                if (pageErrors.length) fail(`${route} pageerror: ${pageErrors.join(' | ')}`);
                else ok(`${route} loaded without JS page errors`);
              } catch (e) {
                fail(`${route} navigation: ${e.message}`);
              }
              await page.close();
            }

            for (const route of ['/', '/index-uk.html', '/index-cz.html']) {
              const page = await context.newPage();
              await page.goto(base + route, {waitUntil:'domcontentloaded'});
              const projects = page.locator('#projects');
              if (await projects.count() !== 1) fail(`${route} missing #projects`);
              const heroCTA = page.locator('.hero .btn.primary').first();
              if (!await heroCTA.count()) fail(`${route} missing hero primary CTA`);
              else {
                await heroCTA.click();
                await page.waitForTimeout(250);
                if (new URL(page.url()).hash !== '#projects') fail(`${route} hero project CTA did not reach #projects; got ${page.url()}`);
                else ok(`${route} hero project CTA works`);
              }
              await page.close();
            }

            {
              const page = await context.newPage();
              await page.setViewportSize({width:390,height:844});
              await page.goto(base+'/', {waitUntil:'domcontentloaded'});
              const menu = page.locator('#menu');
              await menu.click();
              if (await menu.getAttribute('aria-expanded') !== 'true') fail('mobile menu did not open');
              await page.keyboard.press('Escape');
              if (await menu.getAttribute('aria-expanded') !== 'false') fail('mobile menu did not close with Escape');
              else ok('mobile menu open/close works');
              await page.close();
            }

            {
              const page = await context.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.goto(base+'/projects/nexus/index.html',{waitUntil:'domcontentloaded'});
              const navButtons = page.locator('.nav button[data-view]');
              const n = await navButtons.count();
              if (n < 5) fail(`NEXUS nav has only ${n} views`);
              for(let i=0;i<n;i++){
                const b=navButtons.nth(i), view=await b.getAttribute('data-view');
                await b.click(); await page.waitForTimeout(60);
                const target=page.locator('#view-'+view);
                if(!await target.evaluate(el=>el.classList.contains('active'))) fail(`NEXUS view ${view} did not activate`);
              }
              await page.locator('[data-view="analyst"]').first().click();
              await page.locator('#analystInput').fill('17 failed logins for admin from 203.0.113.42, then successful login');
              await page.locator('#localAnalyzeBtn').click();
              await page.waitForTimeout(150);
              const analystText=(await page.locator('#analystResult').innerText()).trim();
              if(analystText.length < 40) fail('NEXUS Analyst returned no useful result'); else ok('NEXUS Analyst works');

              await page.locator('[data-view="osint"]').first().click();
              await page.locator('#targetInput').fill('example.com');
              await page.locator('#targetQuestion').fill('Verify public ownership information');
              await page.locator('#osintForm button[type="submit"]').click();
              await page.waitForTimeout(150);
              const osintText=(await page.locator('#osintResult').innerText()).trim();
              if(osintText.length < 30) fail('NEXUS OSINT returned no worksheet'); else ok('NEXUS OSINT works');

              await page.locator('[data-view="matrix"]').first().click();
              const matrixButton=page.locator('[data-matrix-node]').first();
              if(await matrixButton.count()) await matrixButton.click();
              else await page.locator('#view-matrix svg [data-node]').first().click({force:true});
              await page.waitForTimeout(150);
              const nodeText=(await page.locator('#nodeDetails').innerText()).trim();
              if(nodeText.length < 30 || /Select a node|Виберіть вузол|Vyberte uzel/i.test(nodeText)) fail('NEXUS Network Matrix did not populate asset details'); else ok('NEXUS Network Matrix works');
              if(errors.length) fail('NEXUS pageerror: '+errors.join(' | '));
              await page.close();
            }

            {
              const page = await context.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.goto(base+'/projects/cyber-lab/index.html',{waitUntil:'domcontentloaded'});
              const navButtons=page.locator('.nav button[data-view]');
              const n=await navButtons.count();
              if(n < 8) fail(`Cyber Lab nav has only ${n} views`);
              for(let i=0;i<n;i++){
                const b=navButtons.nth(i),view=await b.getAttribute('data-view');
                await b.click(); await page.waitForTimeout(60);
                if(!await page.locator('#view-'+view).evaluate(el=>el.classList.contains('active'))) fail(`Cyber Lab view ${view} did not activate`);
              }

              await page.locator('[data-view="password"]').click();
              await page.locator('#password-input').fill('ExamplePassphrase123!');
              await page.waitForTimeout(100);
              if(/Waiting for input|Очікування введення|Čekání na vstup/i.test(await page.locator('#password-score').innerText())) fail('Cyber Lab Password Lab did not analyze input'); else ok('Cyber Lab Password Lab works');

              await page.locator('[data-view="phishing"]').click();
              await page.locator('#url-input').fill('https://example.com/login');
              await page.locator('#url-form button[type="submit"]').click();
              await page.waitForTimeout(100);
              const urlText=(await page.locator('#url-result').innerText()).trim();
              if(urlText.length < 25 || /Enter a URL to see educational indicators/i.test(urlText)) fail('Cyber Lab Phishing Lab did not analyze URL'); else ok('Cyber Lab Phishing Lab works');

              await page.locator('[data-view="network"]').click();
              const before=await page.locator('#node-count').innerText();
              await page.locator('#device-ip').fill('192.168.1.31');
              await page.locator('#add-device').click();
              await page.waitForTimeout(100);
              const after=await page.locator('#node-count').innerText();
              if(before===after) fail('Cyber Lab Network Visualizer did not add device'); else ok('Cyber Lab Network Visualizer works');

              await page.locator('[data-view="soc"]').click();
              const answers=page.locator('#soc-answers .answer');
              if(await answers.count()<2) fail('Cyber Lab SOC has no answer choices');
              else { await answers.first().click(); await page.waitForTimeout(100); if(!await page.locator('#soc-feedback').isVisible()) fail('Cyber Lab SOC feedback did not appear'); else ok('Cyber Lab SOC interaction works'); }

              await page.locator('[data-view="academy"]').click();
              if(!(await page.locator('#lesson-list').innerText()).trim()) fail('Cyber Lab Academy lessons did not render'); else ok('Cyber Lab Academy renders');
              if(errors.length) fail('Cyber Lab pageerror: '+errors.join(' | '));
              await page.close();
            }

            await browser.close();
            if(failures.length){
              console.error(`\n${failures.length} failure(s):`);
              failures.forEach((f,i)=>console.error(`${i+1}. ${f}`));
              process.exit(1);
            }
            console.log('\nFINAL BROWSER SMOKE: PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
