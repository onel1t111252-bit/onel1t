name: Patch Cyber Lab SOC cache v2

on:
  push:
    paths:
      - '.github/workflows/patch-cyber-soc-cache-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump SOC localization cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('projects/cyber-lab/index.html')
          s=p.read_text(encoding='utf-8')
          old='soc-localization-force.js?v=20261030-1'
          new='soc-localization-force.js?v=20261030-2'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('SOC localization loader not found')
          p.write_text(s,encoding='utf-8')
          assert new in s
          PY
      - name: Commit cache bump and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-cyber-soc-cache-v2.yml
          git add projects/cyber-lab/index.html
          git commit -m 'Bump Cyber Lab SOC localization cache key'
          git push
