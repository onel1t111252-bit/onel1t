name: Optimize portfolio images

on:
  push:
    paths:
      - '.github/workflows/optimize-assets-pass.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Create optimized WebP assets and update references
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageOps

          out=Path('assets/optimized');out.mkdir(parents=True,exist_ok=True)
          jobs={
            'image.png':('hero-bg.webp',(1920,1200),82),
            'image6.png':('rail-bg.webp',(900,1400),80),
            'image3.png':('banner-bg.webp',(1600,700),80),
            'Gemini_Generated_Image_mmgowemmgowemmgo.jpg':('feature-development.webp',(1000,650),80),
            'Gemini_Generated_Image_kjojpgkjojpgkjoj.jpg':('feature-network.webp',(1000,650),80),
            'Gemini_Generated_Image_kjojpgkjojpgkjoj (1).jpg':('feature-cyber.webp',(1000,650),80),
            'Gemini_Generated_Image_kjojpgkjojpgkjoj (2).jpg':('feature-problem.webp',(1000,650),80),
            'Gemini_Generated_Image_sy6ia3sy6ia3sy6i.jpg':('cv-hero.webp',(1920,1300),82),
            '1793298041137.jpg':('cyber-lab-cover.webp',(1100,760),82),
            '1793298027511.jpg':('nexus-cover.webp',(1100,760),82),
            'Gemini_Generated_Image_217vl4217vl4217v (5).jpg':('cpp-cover.webp',(1100,760),80),
            'Gemini_Generated_Image_217vl4217vl4217v (3).jpg':('python-cover.webp',(1100,760),80),
            'Gemini_Generated_Image_217vl4217vl4217v (4).jpg':('password-cover.webp',(1100,760),80),
            'Gemini_Generated_Image_217vl4217vl4217v (2).jpg':('subnet-cover.webp',(1100,760),80),
            'Gemini_Generated_Image_217vl4217vl4217v.jpg':('phishing-cover.webp',(1100,760),80),
            '1793135210636.jpg':('log-triage-cover.webp',(1100,760),80),
          }
          made={}
          for src,(dst,max_size,quality) in jobs.items():
              source=Path(src)
              if not source.exists():
                  print('skip missing',src);continue
              with Image.open(source) as im:
                  im=ImageOps.exif_transpose(im)
                  im.thumbnail(max_size,Image.Resampling.LANCZOS)
                  target=out/dst
                  save_im=im.convert('RGB') if im.mode not in ('RGB','RGBA') else im
                  save_im.save(target,'WEBP',quality=quality,method=6)
                  made[src]=str(target).replace('\\','/')
                  print(f'{src}: {source.stat().st_size/1e6:.2f} MB -> {target.stat().st_size/1e6:.2f} MB')

          # Homepage HTML project covers.
          replacements={
            '1793298041137.jpg?v=20261029-1':made.get('1793298041137.jpg','1793298041137.jpg?v=20261029-1'),
            '1793298027511.jpg?v=20261029-1':made.get('1793298027511.jpg','1793298027511.jpg?v=20261029-1'),
            'Gemini_Generated_Image_217vl4217vl4217v (5).jpg':made.get('Gemini_Generated_Image_217vl4217vl4217v (5).jpg','Gemini_Generated_Image_217vl4217vl4217v (5).jpg'),
            'Gemini_Generated_Image_217vl4217vl4217v (3).jpg':made.get('Gemini_Generated_Image_217vl4217vl4217v (3).jpg','Gemini_Generated_Image_217vl4217vl4217v (3).jpg'),
            'Gemini_Generated_Image_217vl4217vl4217v (4).jpg':made.get('Gemini_Generated_Image_217vl4217vl4217v (4).jpg','Gemini_Generated_Image_217vl4217vl4217v (4).jpg'),
            'Gemini_Generated_Image_217vl4217vl4217v (2).jpg':made.get('Gemini_Generated_Image_217vl4217vl4217v (2).jpg','Gemini_Generated_Image_217vl4217vl4217v (2).jpg'),
            'Gemini_Generated_Image_217vl4217vl4217v.jpg':made.get('Gemini_Generated_Image_217vl4217vl4217v.jpg','Gemini_Generated_Image_217vl4217vl4217v.jpg'),
            '1793135210636.jpg':made.get('1793135210636.jpg','1793135210636.jpg'),
          }
          for page in ('index.html','index-uk.html','index-cz.html'):
              p=Path(page);s=p.read_text(encoding='utf-8')
              for old,new in replacements.items():s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          # Homepage backgrounds.
          p=Path('home.css');s=p.read_text(encoding='utf-8')
          css_map={
            "url('image6.png')":"url('assets/optimized/rail-bg.webp')",
            "url('image.png')":"url('assets/optimized/hero-bg.webp')",
            "url('image3.png')":"url('assets/optimized/banner-bg.webp')",
            "url('Gemini_Generated_Image_mmgowemmgowemmgo.jpg')":"url('assets/optimized/feature-development.webp')",
            "url('Gemini_Generated_Image_kjojpgkjojpgkjoj.jpg')":"url('assets/optimized/feature-network.webp')",
            "url('Gemini_Generated_Image_kjojpgkjojpgkjoj (1).jpg')":"url('assets/optimized/feature-cyber.webp')",
            "url('Gemini_Generated_Image_kjojpgkjojpgkjoj (2).jpg')":"url('assets/optimized/feature-problem.webp')",
          }
          for old,new in css_map.items():s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # CV hero keeps the exact same artwork, only optimized.
          p=Path('cv-theme.css');s=p.read_text(encoding='utf-8')
          s=s.replace("url('Gemini_Generated_Image_sy6ia3sy6ia3sy6i.jpg')","url('assets/optimized/cv-hero.webp')")
          p.write_text(s,encoding='utf-8')

          # home.js must not overwrite optimized Cyber Lab / NEXUS covers.
          p=Path('home.js');s=p.read_text(encoding='utf-8')
          s=s.replace("cyberImg.src='1793298041137.jpg';","cyberImg.src='assets/optimized/cyber-lab-cover.webp';")
          s=s.replace("nexusImg.src='1793298027511.jpg';","nexusImg.src='assets/optimized/nexus-cover.webp';")
          s=s.replace("const version='smooth-sections-20261029-2';","const version='quality-pass-20261029-1';")
          p.write_text(s,encoding='utf-8')
      - name: Verify referenced optimized files
        shell: python
        run: |
          from pathlib import Path
          required=['hero-bg.webp','rail-bg.webp','feature-development.webp','feature-network.webp','feature-cyber.webp','feature-problem.webp','cv-hero.webp','cyber-lab-cover.webp','nexus-cover.webp','cpp-cover.webp','python-cover.webp','password-cover.webp','subnet-cover.webp','phishing-cover.webp','log-triage-cover.webp']
          for name in required:
              p=Path('assets/optimized')/name
              assert p.exists() and p.stat().st_size>1000,(name,p.stat().st_size if p.exists() else 0)
          for page in ('index.html','index-uk.html','index-cz.html'):
              s=Path(page).read_text(encoding='utf-8')
              assert 'assets/optimized/cyber-lab-cover.webp' in s
              assert 'assets/optimized/nexus-cover.webp' in s
          print('optimized assets verified')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/optimized index.html index-uk.html index-cz.html home.css home.js cv-theme.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Optimize portfolio images for faster mobile loading"
          git push
