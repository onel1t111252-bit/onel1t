name: Refresh Academy localization cache
on:
  push:
    paths:
      - '.github/workflows/bust-academy-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh only localization script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('projects/cyber-lab/index.html')
          s=p.read_text(encoding='utf-8')
          old='localization-complete.js?v=20261029-1'
          new='localization-complete.js?v=20261030-quiz1'
          if old not in s:
              raise SystemExit('Expected localization script version not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/cyber-lab/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Cyber Academy localization cache'
          git push
