name: Bump Cyber Lab localization cache

on:
  push:
    paths:
      - '.github/workflows/bump-cyber-localization-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('projects/cyber-lab/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('localization-complete.js?v=20261030-4','localization-complete.js?v=20261030-6')
          s=s.replace('soc-localization-force.js?v=20261030-2','soc-localization-force.js?v=20261030-3')
          p.write_text(s,encoding='utf-8')
          assert 'localization-complete.js?v=20261030-6' in s
          assert 'soc-localization-force.js?v=20261030-3' in s
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bump-cyber-localization-cache.yml
          git add projects/cyber-lab/index.html
          git commit -m 'Load safe Cyber Lab localization scripts'
          git push
# trigger
