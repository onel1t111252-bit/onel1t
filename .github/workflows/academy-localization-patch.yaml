name: Academy localization patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academy-localization-patch.yaml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Patch Cyber Lab Academy localization
        shell: python
        run: |
          from pathlib import Path
          path = Path('projects/cyber-lab/localization-complete.js')
          text = path.read_text(encoding='utf-8')

          needle = "  if((m=base.match(/^Question (\\d+)$/)))return l==='uk'?`Запитання ${m[1]}`:`Otázka ${m[1]}`;\n"
          insert = needle + "  if((m=base.match(/^(\\d+)\\. (.+)$/))&&T[m[2]])return m[1]+'. '+trExact(m[2],l);\n  if((m=base.match(/^(\\d+) min · (.+)$/))&&T[m[2]])return (l==='uk'?`${m[1]} хв`:`${m[1]} min`)+' · '+trExact(m[2],l);\n  if((m=base.match(/^(Correct! \\+10 XP\\.|Not quite\\.) (.+)$/))&&T[m[1]]&&T[m[2]])return trExact(m[1],l)+' '+trExact(m[2],l);\n"
          if needle not in text:
              raise SystemExit('trDynamic insertion point not found')
          text = text.replace(needle, insert, 1)

          old = "function recognized(base){return !!T[base]||/^(\\d+)% complete$/.test(base)||/^(\\d+) \\/ (\\d+) complete$/.test(base)||/^(\\d+) DEVICES$/.test(base)||/^LESSON \\d+ · /.test(base)||/^Question \\d+$/.test(base)||/^Added .+ at .+\\. Connections shown are illustrative; no real packets are sent\\.$/.test(base)||/^Added a simulated /.test(base)||base.startsWith('HOST: ')||base.startsWith('PROTOCOL: ')||base.includes('INDICATORS TO REVIEW (');}"
          new = """function recognized(base){
  let m;
  if(T[base])return true;
  if((m=base.match(/^(\\d+)\\. (.+)$/))&&T[m[2]])return true;
  if((m=base.match(/^(\\d+) min · (.+)$/))&&T[m[2]])return true;
  if((m=base.match(/^(Correct! \\+10 XP\\.|Not quite\\.) (.+)$/))&&T[m[1]]&&T[m[2]])return true;
  return /^(\\d+)% complete$/.test(base)||/^(\\d+) \\/ (\\d+) complete$/.test(base)||/^(\\d+) DEVICES$/.test(base)||/^LESSON \\d+ · /.test(base)||/^Question \\d+$/.test(base)||/^Added .+ at .+\\. Connections shown are illustrative; no real packets are sent\\.$/.test(base)||/^Added a simulated /.test(base)||base.startsWith('HOST: ')||base.startsWith('PROTOCOL: ')||base.includes('INDICATORS TO REVIEW (');
}"""
          if old not in text:
              raise SystemExit('recognized() block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify JavaScript
        run: node --check projects/cyber-lab/localization-complete.js
      - name: Commit fix
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/cyber-lab/localization-complete.js
          git commit -m 'Fix Cyber Lab Academy dynamic localization'
          git push origin HEAD:main
