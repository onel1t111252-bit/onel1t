name: Apply AEGIS hero artwork

on:
  push:
    paths:
      - '.github/workflows/aegis-photo-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build and install AEGIS hero image
        shell: bash
        run: |
          set -euo pipefail
          cat .aegis-upload/part1.txt .aegis-upload/part2.txt .aegis-upload/part3.txt .aegis-upload/part4.txt | base64 -d > projects/aegis/aegis-ai-core-hero.webp
          test -s projects/aegis/aegis-ai-core-hero.webp
          file projects/aegis/aegis-ai-core-hero.webp | grep -qi webp

          cat > projects/aegis/aegis-hero-photo.css <<'CSS'
          /* AEGIS approved AI Core hero artwork — user-selected visual. */
          body.ai-core-theme .aegis-ai-visual{
            background:
              linear-gradient(180deg,rgba(2,1,3,.01) 0%,rgba(2,1,3,.04) 52%,rgba(3,2,4,.56) 72%,#030204 100%),
              url("./aegis-ai-core-hero.webp?v=20261031-photo1") center 43% / cover no-repeat !important;
          }
          body.ai-core-theme .aegis-ai-visual::before,
          body.ai-core-theme .aegis-ai-visual::after,
          body.ai-core-theme .ai-core-orb,
          body.ai-core-theme .ai-floor{
            display:none !important;
          }
          body.ai-core-theme .hero-panel{
            background:#030204 !important;
          }
          body.ai-core-theme .ai-side-copy{
            text-shadow:0 2px 18px rgba(0,0,0,.92),0 0 18px rgba(255,10,138,.32);
          }
          body.ai-core-theme .ai-live{
            backdrop-filter:blur(8px);
            background:rgba(4,1,5,.66) !important;
          }
          @media(max-width:760px){
            body.ai-core-theme .hero-panel{min-height:980px!important}
            body.ai-core-theme .aegis-ai-visual{
              background-position:center top!important;
              background-size:100% auto!important;
              background-repeat:no-repeat!important;
              background-color:#030204!important;
            }
            body.ai-core-theme .hero-panel:before{
              background:linear-gradient(180deg,transparent 0 47%,rgba(3,2,4,.28) 55%,rgba(3,2,4,.94) 67%,#030204 78%)!important;
            }
            body.ai-core-theme .hero-copy{
              padding-top:545px!important;
              background:transparent!important;
            }
            body.ai-core-theme .hero-kicker{margin-top:0!important}
            body.ai-core-theme .ai-side-copy{top:13%!important;left:6%!important}
            body.ai-core-theme .ai-live{top:3%!important;right:4%!important}
          }
          @media(max-width:420px){
            body.ai-core-theme .hero-panel{min-height:930px!important}
            body.ai-core-theme .hero-copy{padding-top:500px!important;padding-left:22px!important;padding-right:22px!important}
          }
          CSS

          python - <<'PY'
          from pathlib import Path
          p=Path('projects/aegis/index.html')
          s=p.read_text()
          old='  <link rel="stylesheet" href="aegis-ai-core.css?v=20261031-1">\n'
          new=old+'  <link rel="stylesheet" href="aegis-hero-photo.css?v=20261031-photo1">\n'
          if 'aegis-hero-photo.css' not in s:
              if old not in s:
                  raise SystemExit('AEGIS AI Core stylesheet anchor not found')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

          rm -rf .aegis-upload
          rm -f .github/workflows/aegis-photo-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use approved AEGIS AI Core hero artwork"
          git push
