name: Mini projects quality pass

on:
  push:
    paths:
      - '.github/workflows/audit-projects-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch mini projects and shared homepage behavior
        shell: python
        run: |
          from pathlib import Path

          # Load shared localization in the four interactive mini labs.
          mini_pages=[
            'projects/password-strength-lab/index.html',
            'projects/ipv4-subnet-calculator/index.html',
            'projects/phishing-link-analyzer/index.html',
            'projects/security-log-triage/index.html',
          ]
          tag='<script src="../mini-localization.js?v=20261029-1"></script>'
          for name in mini_pages:
              p=Path(name); s=p.read_text(encoding='utf-8')
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding='utf-8')

          # Correct /31 and /32 host display: first/last are already calculated correctly.
          p=Path('projects/ipv4-subnet-calculator/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("['First usable host',prefix<=30?numToIp(first):'N/A for /32'],['Last usable host',prefix<=30?numToIp(last):'N/A for /32']", "['First usable host',numToIp(first)],['Last usable host',numToIp(last)]")
          p.write_text(s,encoding='utf-8')

          # Remove unused/dead phishing variable with an invalid boolean comparison.
          p=Path('projects/phishing-link-analyzer/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const brandHits=brands.filter(b=>host.includes(b)&&!host===b);","")
          p.write_text(s,encoding='utf-8')

          # Standardize the two already-localized code projects on the global language preference.
          for name in ('projects/cpp-console-toolkit/index.html','projects/python-security-utilities/index.html'):
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=s.replace('<button data-lang="en" class="active">EN</button><button data-lang="uk">UA</button><button data-lang="cs">CZ</button>', '<button type="button" data-lang="en" class="active">EN</button><button type="button" data-lang="uk">UA</button><button type="button" data-lang="cs">CZ</button>')
              old="function setLang(lang){document.documentElement.lang=lang;document.getElementById('title').textContent=copy[lang].title;document.getElementById('desc').textContent=copy[lang].desc;document.getElementById('featuresTitle').textContent=copy[lang].featuresTitle;document.getElementById('features').innerHTML=copy[lang].features.map(x=>'<div>'+x+'</div>').join('');document.getElementById('download').textContent=copy[lang].download;document.getElementById('back').textContent=copy[lang].back;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));localStorage.setItem('onel1t-project-lang',lang)}\ndocument.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));setLang(localStorage.getItem('onel1t-project-lang')||'en');"
              new="function setLang(lang){document.documentElement.lang=lang;document.getElementById('title').textContent=copy[lang].title;document.getElementById('desc').textContent=copy[lang].desc;document.getElementById('featuresTitle').textContent=copy[lang].featuresTitle;document.getElementById('features').innerHTML=copy[lang].features.map(x=>'<div>'+x+'</div>').join('');document.getElementById('download').textContent=copy[lang].download;document.getElementById('back').textContent=copy[lang].back;document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',b.dataset.lang===lang?'true':'false')});const common=lang==='uk'?'ua':lang==='cs'?'cz':'en';localStorage.setItem('onel1t-lang',common);const brand=document.querySelector('.brand');if(brand)brand.href=lang==='uk'?'../../index-uk.html':lang==='cs'?'../../index-cz.html':'../../index.html'}\ndocument.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));const stored=localStorage.getItem('onel1t-lang')||'en';setLang(stored==='ua'?'uk':stored==='cz'?'cs':'en');"
              if old not in s:
                  raise SystemExit(f'language block not found in {name}')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')

          # Homepages should set the shared language preference before projects are opened.
          p=Path('home-core.js'); s=p.read_text(encoding='utf-8')
          marker="const railNav=document.querySelector('.rail nav');\n"
          lang_code="\n/* Share the selected homepage language with every project. */\ntry{const pageLang=(document.documentElement.lang||'en').toLowerCase();localStorage.setItem('onel1t-lang',pageLang==='uk'?'ua':pageLang==='cs'?'cz':'en')}catch(_){}\n"
          if 'Share the selected homepage language with every project.' not in s:
              s=s.replace(marker,marker+lang_code,1)

          # Remove obsolete project-image rewriting. HTML/home.js are the single source of truth.
          start=s.find('/* Project imagery. */')
          end=s.find('requestAnimationFrame(()=>{',start)
          if start!=-1 and end!=-1:
              s=s[:start]+"/* Project covers are defined by the page markup and home.js. */\n\n"+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check projects/mini-localization.js
          node --check home-core.js
          python - <<'PY'
          from pathlib import Path
          tag='<script src="../mini-localization.js?v=20261029-1"></script>'
          for name in ('projects/password-strength-lab/index.html','projects/ipv4-subnet-calculator/index.html','projects/phishing-link-analyzer/index.html','projects/security-log-triage/index.html'):
              assert tag in Path(name).read_text(encoding='utf-8'), name
          ip=Path('projects/ipv4-subnet-calculator/index.html').read_text(encoding='utf-8')
          assert "['First usable host',numToIp(first)]" in ip
          assert "N/A for /32" not in ip
          core=Path('home-core.js').read_text(encoding='utf-8')
          assert 'featuredProjectImages' not in core and 'projectsSectionImages' not in core
          assert "localStorage.setItem('onel1t-lang'" in core
          print('mini project pass verified')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects home-core.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Localize mini labs and fix project behavior"
          git push
