name: Final browser smoke v3

on:
  push:
    branches: [final-smoke]
    paths:
      - '.github/workflows/final-browser-smoke-v3.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1 >/dev/null 2>&1
      - name: Run complete live-site checks
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const base='https://onel1t111252-bit.github.io/onel1t';
          const routes=['/','/index-uk.html','/index-cz.html','/cv.html','/cv-uk.html','/cv-cz.html','/projects/nexus/index.html','/projects/cyber-lab/index.html','/projects/cpp-console-toolkit/index.html','/projects/python-security-utilities/index.html','/projects/password-strength-lab/index.html','/projects/ipv4-subnet-calculator/index.html','/projects/phishing-link-analyzer/index.html','/projects/security-log-triage/index.html'];
          const failures=[];
          const fail=m=>{failures.push(m);console.error('FAIL:',m)};
          const ok=m=>console.log('OK:',m);
          async function check(name,fn){try{await fn();ok(name)}catch(e){fail(name+' — '+e.message)}}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1280,height:900}});

            for(const route of routes){
              await check('load '+route,async()=>{
                const page=await context.newPage(); const errs=[]; page.on('pageerror',e=>errs.push(String(e)));
                const r=await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(450);
                if(!r||r.status()>=400)throw new Error('HTTP '+(r&&r.status()));
                if(!(await page.title()).trim())throw new Error('empty title');
                if((await page.locator('body').innerText()).trim().length<30)throw new Error('empty body');
                if(errs.length)throw new Error('pageerror: '+errs.join(' | '));
                await page.close();
              });
            }

            for(const route of ['/','/index-uk.html','/index-cz.html']){
              await check('hero CTA '+route,async()=>{
                const page=await context.newPage();await page.goto(base+route,{waitUntil:'domcontentloaded'});
                const cta=page.locator('.hero .btn.primary').first();if(!await cta.count())throw new Error('CTA missing');
                await cta.click();await page.waitForTimeout(150);
                if(new URL(page.url()).hash!=='#projects')throw new Error('got '+page.url());
                await page.close();
              });
            }

            await check('mobile menu',async()=>{
              const page=await context.newPage();await page.setViewportSize({width:390,height:844});await page.goto(base+'/',{waitUntil:'domcontentloaded'});
              const m=page.locator('#menu');await m.click();if(await m.getAttribute('aria-expanded')!=='true')throw new Error('did not open');
              await page.keyboard.press('Escape');if(await m.getAttribute('aria-expanded')!=='false')throw new Error('did not close with Escape');await page.close();
            });

            await check('NEXUS navigation + language + Analyst + OSINT + Matrix',async()=>{
              const page=await context.newPage();const errs=[];page.on('pageerror',e=>errs.push(String(e)));await page.goto(base+'/projects/nexus/index.html',{waitUntil:'domcontentloaded'});await page.waitForTimeout(250);
              const nav=page.locator('.nav button[data-view]');const n=await nav.count();if(n<5)throw new Error('only '+n+' views');
              for(let i=0;i<n;i++){const b=nav.nth(i),v=await b.getAttribute('data-view');await b.click();await page.waitForTimeout(40);if(!await page.locator('#view-'+v).evaluate(el=>el.classList.contains('active')))throw new Error('view '+v+' inactive')}
              await page.locator('.language-switch [data-lang="ua"]').click();await page.waitForTimeout(80);if(await page.locator('html').getAttribute('lang')!=='uk')throw new Error('UA lang switch failed');
              await page.locator('.language-switch [data-lang="cz"]').click();await page.waitForTimeout(80);if(await page.locator('html').getAttribute('lang')!=='cs')throw new Error('CZ lang switch failed');
              await page.locator('.language-switch [data-lang="en"]').click();
              await page.locator('[data-view="analyst"]').first().click();await page.locator('#analystInput').fill('17 failed logins for admin from 203.0.113.42, then successful login');await page.locator('#localAnalyzeBtn').click();await page.waitForTimeout(120);if((await page.locator('#analystResult').innerText()).trim().length<40)throw new Error('Analyst empty');
              await page.locator('[data-view="osint"]').first().click();await page.locator('#targetInput').fill('example.com');await page.locator('#targetQuestion').fill('Verify public ownership information');const ob=page.locator('#createOsintWorksheetBtn');if(!await ob.count())throw new Error('OSINT action button missing');await ob.click();await page.waitForTimeout(120);if((await page.locator('#osintResult').innerText()).trim().length<30)throw new Error('OSINT result empty');
              await page.locator('[data-view="matrix"]').first().click();let mb=page.locator('[data-matrix-node]').first();if(await mb.count())await mb.click();else await page.locator('#view-matrix svg [data-node]').first().click({force:true});await page.waitForTimeout(120);const nt=(await page.locator('#nodeDetails').innerText()).trim();if(nt.length<30||/Select a node|Виберіть вузол|Vyberte uzel/i.test(nt))throw new Error('Matrix details empty');
              if(errs.length)throw new Error('pageerror: '+errs.join(' | '));await page.close();
            });

            await check('Cyber Lab navigation + language + tools',async()=>{
              const page=await context.newPage();const errs=[];page.on('pageerror',e=>errs.push(String(e)));await page.goto(base+'/projects/cyber-lab/index.html',{waitUntil:'domcontentloaded'});await page.waitForTimeout(250);
              const nav=page.locator('.nav button[data-view]');const n=await nav.count();if(n<8)throw new Error('only '+n+' views');
              for(let i=0;i<n;i++){const b=nav.nth(i),v=await b.getAttribute('data-view');await b.click();await page.waitForTimeout(40);if(!await page.locator('#view-'+v).evaluate(el=>el.classList.contains('active')))throw new Error('view '+v+' inactive')}
              await page.locator('.language-switch [data-lang="ua"]').click();await page.waitForTimeout(80);if(await page.locator('html').getAttribute('lang')!=='uk')throw new Error('UA lang switch failed');
              await page.locator('.language-switch [data-lang="cz"]').click();await page.waitForTimeout(80);if(await page.locator('html').getAttribute('lang')!=='cs')throw new Error('CZ lang switch failed');
              await page.locator('.language-switch [data-lang="en"]').click();
              await page.locator('[data-view="password"]').click();await page.locator('#password-input').fill('ExamplePassphrase123!');await page.waitForTimeout(80);if(/Waiting for input|Очікування введення|Čekání na vstup/i.test(await page.locator('#password-score').innerText()))throw new Error('Password Lab unchanged');
              await page.locator('[data-view="phishing"]').click();await page.locator('#url-input').fill('https://example.com/login');await page.locator('#url-form').evaluate(f=>f.requestSubmit());await page.waitForTimeout(80);const ur=(await page.locator('#url-result').innerText()).trim();if(ur.length<25||/Enter a URL to see educational indicators/i.test(ur))throw new Error('Phishing result unchanged');
              await page.locator('[data-view="network"]').click();const before=await page.locator('#node-count').innerText();await page.locator('#device-ip').fill('192.168.1.31');await page.locator('#add-device').click();await page.waitForTimeout(80);if(before===await page.locator('#node-count').innerText())throw new Error('Network node not added');
              await page.locator('[data-view="soc"]').click();await page.waitForTimeout(80);const answers=page.locator('#soc-answers .answer');if(await answers.count()<2)throw new Error('SOC answers missing');await answers.first().click();await page.waitForTimeout(80);if(!await page.locator('#soc-feedback').isVisible())throw new Error('SOC feedback hidden');
              await page.locator('[data-view="academy"]').click();await page.waitForTimeout(80);if(!(await page.locator('#lesson-list').innerText()).trim())throw new Error('Academy empty');
              if(errs.length)throw new Error('pageerror: '+errs.join(' | '));await page.close();
            });

            await browser.close();
            if(failures.length){console.error('\nFAILURES: '+failures.length);failures.forEach((x,i)=>console.error((i+1)+'. '+x));process.exit(1)}
            console.log('\nFINAL BROWSER SMOKE V3: PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
