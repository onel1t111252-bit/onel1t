name: Apply AEGIS obsidian amber identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-aegis-identity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Attach AEGIS identity and portfolio navigation safely
        shell: python
        run: |
          from pathlib import Path

          path = Path('projects/aegis/index.html')
          text = path.read_text(encoding='utf-8')

          old_theme = '<meta name="theme-color" content="#03050a">'
          new_theme = '<meta name="theme-color" content="#090705">'
          css_needle = '<link rel="stylesheet" href="styles.css?v=aegis-redesign-20261030-1">'
          css_insert = css_needle + '\n  <link rel="stylesheet" href="aegis-identity.css?v=20261031-1">'
          js_needle = '<script src="app.js?v=aegis-localization-20261030-3"></script>'
          js_insert = js_needle + '\n  <script src="aegis-portfolio-link.js?v=20261031-1"></script>'

          for needle in (old_theme, css_needle, js_needle):
              if needle not in text:
                  raise SystemExit(f'Expected AEGIS marker not found: {needle}')

          if 'aegis-identity.css' in text or 'aegis-portfolio-link.js' in text:
              raise SystemExit('AEGIS identity layer already appears to be connected.')

          text = text.replace(old_theme, new_theme, 1)
          text = text.replace(css_needle, css_insert, 1)
          text = text.replace(js_needle, js_insert, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit AEGIS identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/aegis/index.html
          git commit -m 'Apply obsidian amber identity to AEGIS'
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          rm .github/workflows/apply-aegis-identity.yml
          git add .github/workflows/apply-aegis-identity.yml
          git commit -m 'Remove one-time AEGIS identity workflow'
          git push
