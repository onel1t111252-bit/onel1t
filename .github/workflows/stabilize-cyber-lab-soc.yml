name: Stabilize Cyber Lab SOC

on:
  push:
    paths:
      - '.github/workflows/stabilize-cyber-lab-soc.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove SOC observers and localize render directly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('projects/cyber-lab/index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'\n?<script src="soc-localization-force\.js\?v=[^"]+"></script>', '', s)
          s = s.replace('localization-complete.js?v=20261030-4', 'localization-complete.js?v=20261030-5')

          helper = r'''function socTr(text){
  if(current==='en')return text;
  const item=translations[text];
  return item?item[langIndex(current)]:text;
}
'''
          marker = 'let socIndex=0,socLocked=false,socSessionCorrect=0,socSessionXp=0;'
          if 'function socTr(text)' not in s:
              if marker not in s:
                  raise SystemExit('SOC state marker not found')
              s = s.replace(marker, helper + marker, 1)

          render = r'''function renderSoc(){
  const d=demoEvents[socIndex];
  $('#soc-index').innerHTML=String(socIndex+1).padStart(2,'0')+'<span style="font-size:14px;color:var(--muted)"> / 04</span>';
  $('#soc-title').textContent=socTr(d.title);
  $('#soc-description').textContent=socTr(d.desc);
  $('#soc-severity').textContent=socTr(d.severity);
  $('#soc-severity').className='severity '+(d.severity==='CRITICAL'||d.severity==='HIGH'?'critical':'');
  $('#soc-log').textContent=d.log;
  $('#soc-meta').innerHTML='<div class="soc-meta-grid"><div><small>'+esc(socTr('Source'))+'</small><strong>'+esc(socTr(d.source))+'</strong></div><div><small>'+esc(socTr('Affected asset'))+'</small><strong>'+esc(socTr(d.asset))+'</strong></div><div><small>'+esc(socTr('Detection rule'))+'</small><strong>'+esc(socTr(d.rule))+'</strong></div><div><small>'+esc(socTr('MITRE ATT&CK mapping'))+'</small><strong>'+esc(socTr(d.mitre))+'</strong></div></div><div class="soc-context"><b>'+esc(socTr('Analyst context'))+'</b><p>'+esc(socTr(d.context))+'</p><b>'+esc(socTr('Recommended first action'))+'</b><p>'+esc(socTr(d.firstAction))+'</p></div>';
  const question=$('#soc-answers').previousElementSibling;
  if(question)question.textContent=socTr('1. How would you classify this event?');
  $('#soc-answers').innerHTML='';
  d.answers.forEach((a,i)=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='answer';
    b.textContent=(String.fromCharCode(65+i)+'. ')+socTr(a);
    b.onclick=()=>answerSoc(i,b);
    $('#soc-answers').append(b);
  });
  $('#soc-feedback').style.display='none';
  $('#soc-next').style.display='none';
  $('#soc-status').textContent=socTr('IN PROGRESS');
  socLocked=false;
}
function answerSoc'''
          s, n = re.subn(r'function renderSoc\(\)\{.*?\}\nfunction answerSoc', render, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'renderSoc replacement count={n}')

          answer = r'''function answerSoc(i,btn){
  if(socLocked)return;
  socLocked=true;
  const d=demoEvents[socIndex],ok=i===d.correct;
  $$('#soc-answers .answer').forEach((b,j)=>{b.disabled=true;if(j===d.correct)b.classList.add('correct')});
  if(!ok)btn.classList.add('wrong');
  const fb=$('#soc-feedback');
  fb.style.display='block';
  fb.textContent=(ok?socTr('CORRECT — +25 XP')+'\n\n':socTr('NOT QUITE')+'\n\n')+socTr(d.why);
  if(ok){
    socSessionCorrect++;socSessionXp+=25;state.incidents++;state.socCorrect++;
    award(25,'SOC Simulator',d.title+' — correct classification');
  }else{
    state.incidents++;logActivity('SOC Simulator',d.title+' — reviewed','—');save();
  }
  $('#soc-correct').textContent=socSessionCorrect;
  $('#soc-xp').textContent=socSessionXp;
  $('#soc-next').style.display='inline-block';
  $('#soc-next').textContent=socIndex===demoEvents.length-1?socTr('Finish session ✓'):socTr('Next scenario →');
  save();
}
$('#soc-next').onclick'''
          s, n = re.subn(r'function answerSoc\(i,btn\)\{.*?\}\n\$\(\'#soc-next\'\)\.onclick', answer, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'answerSoc replacement count={n}')

          old = " translate();\n const label=document.querySelector('[data-home-label]');"
          new = " translate();\n if(typeof renderSoc==='function')renderSoc();\n const label=document.querySelector('[data-home-label]');"
          if old in s:
              s = s.replace(old, new, 1)
          elif "if(typeof renderSoc==='function')renderSoc();" not in s:
              raise SystemExit('setLang hook not found')

          p.write_text(s, encoding='utf-8')

          q = Path('projects/cyber-lab/localization-complete.js')
          t = q.read_text(encoding='utf-8')
          t = t.replace("  installAcademyLocalizationFix();\n  installSocLocalizationFix();", "  installAcademyLocalizationFix();")
          q.write_text(t, encoding='utf-8')

          assert 'soc-localization-force.js' not in s
          assert 'function socTr(text)' in s
          assert "socTr('1. How would you classify this event?')" in s
          assert 'installSocLocalizationFix();' not in t
          PY
      - name: Validate JavaScript
        run: |
          node --check projects/cyber-lab/localization-complete.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('projects/cyber-lab/index.html').read_text(encoding='utf-8')
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script\s*>',text,re.I|re.S),1):
              if re.search(r'\bsrc\s*=',m.group(1),re.I) or not m.group(2).strip(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(m.group(2)); name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              Path(name).unlink(missing_ok=True)
              if r.returncode: raise SystemExit(f'inline script {i}: {r.stderr}')
          print('Cyber Lab inline JS syntax OK')
          PY
      - name: Commit stable SOC implementation and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stabilize-cyber-lab-soc.yml
          git rm -f projects/cyber-lab/soc-localization-force.js
          git add projects/cyber-lab/index.html projects/cyber-lab/localization-complete.js
          git commit -m 'Stabilize Cyber Lab SOC localization without observers'
          git push
