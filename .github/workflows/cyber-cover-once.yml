name: Apply Cyber Lab green cover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cyber-cover-once.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild Cyber Lab cover
        run: |
          set -euo pipefail
          cat .tmp-cyber-small/chunk_*.txt | tr -d '\n\r' | base64 -d > assets/optimized/cyber-lab-cover.webp
          test -s assets/optimized/cyber-lab-cover.webp
          file assets/optimized/cyber-lab-cover.webp
          rm -rf .tmp-cyber-small .tmp-cyber-cover
          rm -f .github/workflows/cyber-cover-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Cyber Lab cover with green matrix artwork"
          git push
